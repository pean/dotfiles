# AeroSpace configuration
# Managed by dotfiles + RCM
#
# Replaces Hammerspoon for window/space management (see git history of
# hammerspoon/init.lua). Switched because macOS 27 moved the Mission Control
# accessibility tree from the Dock to WindowManager, breaking both native
# Spaces shortcuts and Hammerspoon's hs.spaces (upstream issue:
# https://github.com/Hammerspoon/hammerspoon/issues/3897). AeroSpace
# reimplements Spaces itself instead of driving native Mission Control, so
# it isn't affected.
#
# This config intentionally stays close to AeroSpace's own defaults
# (https://github.com/nikitabobko/AeroSpace/blob/main/docs/config-examples/default-config.toml)
# rather than recreating old Hammerspoon bindings — fewer overrides to
# maintain, and defaults are what most docs/community help assumes.
#
# Not carried over from Hammerspoon (no AeroSpace equivalent):
#   - Vim-style window hints (Ctrl+Alt+;) for jump-to-window by letter.
#   - Blocking Cmd+M globally. Disable "Minimize" in System Settings ->
#     Keyboard -> Keyboard Shortcuts -> Mission Control instead, if wanted.

config-version = 2
after-startup-command = []
start-at-login = true
auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "A", "B",
                         "C", "D", "E", "F", "G", "I", "M", "N", "O", "P", "Q",
                         "R", "S", "T", "U", "V", "W", "X", "Y", "Z"]

on-mode-changed = []

focus-follows-mouse.enabled = false
key-mapping.preset = 'qwerty'

gaps.inner.horizontal = 8
gaps.inner.vertical =   8
gaps.outer.left =       8
gaps.outer.bottom =     8
gaps.outer.top =        8
gaps.outer.right =      8

[mode.main.binding]
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # Fullscreen toggle. Replaces Hammerspoon's Ctrl+Alt+F / Cmd+Shift+F maximize.
    alt-f = 'fullscreen'

    # Move focused window to a monitor in that direction. Not bound by
    # default upstream; replaces Hammerspoon's Ctrl+Alt+H/L/N monitor moves.
    alt-shift-left = 'move-node-to-monitor left --focus-follows-window'
    alt-shift-right = 'move-node-to-monitor right --focus-follows-window'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    alt-a = 'workspace A' # In your config, you can drop workspace bindings that you don't need
    alt-b = 'workspace B'
    alt-c = 'workspace C'
    alt-d = 'workspace D'
    alt-e = 'workspace E'
    alt-g = 'workspace G'
    alt-i = 'workspace I'
    alt-m = 'workspace M'
    alt-n = 'workspace N'
    alt-o = 'workspace O'
    alt-p = 'workspace P'
    alt-q = 'workspace Q'
    alt-r = 'workspace R'
    alt-s = 'workspace S'
    alt-t = 'workspace T'
    alt-u = 'workspace U'
    alt-v = 'workspace V'
    alt-w = 'workspace W'
    alt-x = 'workspace X'
    alt-y = 'workspace Y'
    alt-z = 'workspace Z'

    alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
    alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
    alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
    alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
    alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
    alt-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'
    alt-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'
    alt-shift-8 = 'move-node-to-workspace 8 --focus-follows-window'
    alt-shift-9 = 'move-node-to-workspace 9 --focus-follows-window'
    alt-shift-a = 'move-node-to-workspace A --focus-follows-window'
    alt-shift-b = 'move-node-to-workspace B --focus-follows-window'
    alt-shift-c = 'move-node-to-workspace C --focus-follows-window'
    alt-shift-d = 'move-node-to-workspace D --focus-follows-window'
    alt-shift-e = 'move-node-to-workspace E --focus-follows-window'
    alt-shift-g = 'move-node-to-workspace G --focus-follows-window'
    alt-shift-i = 'move-node-to-workspace I --focus-follows-window'
    alt-shift-m = 'move-node-to-workspace M --focus-follows-window'
    alt-shift-n = 'move-node-to-workspace N --focus-follows-window'
    alt-shift-o = 'move-node-to-workspace O --focus-follows-window'
    alt-shift-p = 'move-node-to-workspace P --focus-follows-window'
    alt-shift-q = 'move-node-to-workspace Q --focus-follows-window'
    alt-shift-r = 'move-node-to-workspace R --focus-follows-window'
    alt-shift-s = 'move-node-to-workspace S --focus-follows-window'
    alt-shift-t = 'move-node-to-workspace T --focus-follows-window'
    alt-shift-u = 'move-node-to-workspace U --focus-follows-window'
    alt-shift-v = 'move-node-to-workspace V --focus-follows-window'
    alt-shift-w = 'move-node-to-workspace W --focus-follows-window'
    alt-shift-x = 'move-node-to-workspace X --focus-follows-window'
    alt-shift-y = 'move-node-to-workspace Y --focus-follows-window'
    alt-shift-z = 'move-node-to-workspace Z --focus-follows-window'

    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    alt-shift-semicolon = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']
